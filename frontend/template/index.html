<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="{{url_for('static', filename='favicon.ico')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
    <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
    <script src="{{url_for('static', filename='main.js')}}" type="module"></script>
    <title>Open Data DEx</title>
  </head>
  <body>
    <div id="DEx">
      <div id="cyto-container">
        <div id="cyto"></div>
        <button id="hub-btn">Return to hub object</button>
        <div id="related-count-controls">
          <button id="decrease-related">-</button>
          <span id="related-count">6</span>
          <button id="increase-related">+</button>
        </div>
        <button id="back-btn">Previous object</button>
        <input id="label-search" type="text" placeholder="Search objects...">
      </div>
      <div id="info-pane"> 
        <div id="query-box">
          <div id="query-left">
            <label for="endpoint-select">sparql endpoint(s):</label>
            <select id="endpoint-select">
              <option value="wikidata">Wikidata</option>
              <option value="custom">Custom...</option>
            </select>
            <textarea id="endpoint-editor" spellcheck="false"></textarea>
            <button id="generate-btn">Generate new DEx</button>
          </div>
          <div id="query-right">
            <label for="query-select">sparql query:</label>
            <select id="query-select">
              <option value="wiki_space">Wikipedia pages on entries from the Unified Astronomy Thesaurus</option>
              <option value="wiki_public">Wikipedia pages on creative works that entered the public domain</option>
              <option value="wiki_dogs">Wikipedia pages on notable dogs</option>
              <option value="wiki_laws">Wikipedia pages on US Supreme Court rulings</option>
              <option value="wiki_mariners">Wikipedia pages on Seattle Mariners players</option>
              
              <option value="wiki_soc">Wikidata URIs on occupations with an SOC code</option>
              <option value="wiki_onet">Wikidata URIs on occupations with an O*NET code</option>
              <option value="wiki_naics">Wikidata URIs on industries with an NAICS code</option>

              <option value="custom">Custom...</option>
            </select>
            <textarea id="query-construct" spellcheck="false" readonly></textarea>
            <textarea id="query-editor" spellcheck="false"></textarea>
            <textarea id="query-limit" spellcheck="false" readonly></textarea>
          </div>
        </div>
        <iframe id="obj-display"></iframe>
      </div>
    </div>
  </body>
</html>
