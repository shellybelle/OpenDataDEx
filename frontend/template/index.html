<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="{{url_for('static', filename='favicon.ico')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
    <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
    <script src="{{url_for('static', filename='main.js')}}" type="module"></script>
    <title>tagology</title>
  </head>
  <body>
    <div id="DEx">
      <div id="cyto-container">
        <div id="cyto"></div>
        <div id="related-count-controls">
          <button id="decrease-related">-</button>
          <span id="related-count">6</span>
          <button id="increase-related">+</button>
        </div>
      </div>
      <div id="info-pane"> 
        <div id="query-box" class="DEx-right">
          <h3>The DEx: Data Explorer for Open Data across the web</h3>
          <div id="query-columns">
            <div id="query-left">
              <label for="endpoint-select">sparql endpoint(s):</label>
              <select id="endpoint-select">
                <option value="wikidata">Wikidata</option>
                <option value="custom">Custom...</option>
              </select>
              <textarea id="endpoint-editor" spellcheck="false" readonly></textarea>
              <button id="generate-btn" disabled>Generate new DEx</button>
            </div>
            <div id="query-right">
              <label for="query-select">sparql query:</label>
              <select id="query-select">
                <option value="wiki-space">Wikipedia pages for items in the Unified Astronomy Thesaurus</option>
                <option value="wiki-dogs">All wikipedia pages about famous dogs</option>
                <option value="wiki-cats">All wikipedia pages about famous cats</option>
                <option value="custom">Custom...</option>
              </select>
              <textarea id="query-editor" spellcheck="false" readonly></textarea>
            </div>
          </div>
        </div>
        <iframe id="obj-display" src="{{url_for('welcome_page')}}"></iframe>
      </div>
    </div>
  </body>
</html>
